<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher Tamanho - Pixel Art</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.2">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/paleta-de-cores.png') }}">
</head>

<body class="tela-menu">
    <div class="card-menu">
        <h2 class="titulo_tamanhoC">Escolha o Tamanho do Painel</h2>

        <div class="container-cards">

            <div class="card-opcao" onclick="window.location.href='/editor?tamanho=8'">
                <img src="{{ url_for('static', filename='images/8x8.png') }}" alt="Matriz 8x8">
                <span>8 x 8</span>
                <small>Pequeno</small>
            </div>

            <div class="card-opcao" onclick="window.location.href='/editor?tamanho=16'">
                <img src="{{ url_for('static', filename='images/16x16.png') }}" alt="Matriz 16x16">
                <span>16 x 16</span>
                <small>Médio</small>
            </div>

            <div class="card-opcao" onclick="window.location.href='/editor?tamanho=32'">
                <img src="{{ url_for('static', filename='images/32x32.png') }}" alt="Matriz 32x32">
                <span>32 x 32</span>
                <small>Grande</small>
            </div>

        </div>

        <br>

        <button onclick="window.location.href='/'" class="beautiful-button">
            Voltar ao Menu
        </button>
    </div>
</body>
</html>
